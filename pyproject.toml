[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-vision-relay"
version = "0.1.0"
description = "A dependency-light, backpressure-aware relay for edge vision events."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.95,<1",
  "uvicorn>=0.20,<1",
]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-asyncio>=0.21", "httpx>=0.23"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
